{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-7 col-lg-6 reveal">
        <div class="card p-5 border-0 shadow-lg rounded-2xl">
            <div class="text-center mb-5">
                <div class="mb-4">
                    <i class="fas fa-graduation-cap fa-3x text-primary op-20"></i>
                </div>
                <h2 class="hero-headline h3 mb-2">Join <span class="text-gradient">EduPulse</span></h2>
                <p class="text-secondary small">Start your intelligent, calm learning journey today</p>
            </div>
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-secondary small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control border-light p-3" placeholder="johndoe"
                            required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-secondary small fw-bold">I am a...</label>
                        <select name="role" class="form-select border-light p-3">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="parent">Parent</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control border-light p-3"
                        placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control border-light p-3" placeholder="••••••••"
                        required>
                    <p class="text-muted mt-2 mb-0" style="font-size: 0.7rem;">Minimum 8 characters with at least one
                        number.</p>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Create Account</button>
                <div class="text-center">
                    <p class="text-secondary small mb-0">Already have an account? <a href="{{ url_for('auth.login') }}"
                            class="text-primary fw-bold text-decoration-none">Login instead</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .form-control:focus,
    .form-select:focus {
        background: white;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .op-20 {
        opacity: 0.2;
    }
</style>
{% endblock %}
