{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center reveal">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 p-md-5">
            <h3 class="fw-bold mb-4">Create New Task</h3>

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">TASK TITLE</label>
                    <input type="text" name="title" class="form-control form-control-lg"
                        placeholder="e.g. Complete Math Assignment" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">DESCRIPTION (Optional)</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Add details..."></textarea>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">DUE DATE</label>
                        <input type="date" name="due_date" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">PRIORITY</label>
                        <select name="priority" class="form-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a href="{{ url_for('tasks.hub') }}" class="btn btn-outline text-muted">Cancel</a>
                    <button type="submit" class="btn btn-primary px-5">Create Task</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
