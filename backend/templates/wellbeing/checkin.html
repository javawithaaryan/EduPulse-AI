{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center reveal">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 p-md-5 text-center">
            <i class="fas fa-heart text-accent-pink fa-3x mb-3"></i>
            <h3 class="fw-bold mb-2">How are you feeling today?</h3>
            <p class="text-secondary mb-4">Your well-being matters. Take a moment to check in with yourself.</p>

            <form method="POST">
                <!-- Mood Level -->
                <div class="mb-5">
                    <label class="form-label text-secondary small fw-bold d-block mb-3">YOUR MOOD</label>
                    <div class="d-flex justify-content-around mood-selector">
                        {% for i in range(1, 6) %}
                        <label class="mood-option">
                            <input type="radio" name="mood" value="{{ i }}" required {% if existing and
                                existing.mood_level==i %}checked{% endif %}>
                            <div class="mood-emoji">
                                {% if i == 1 %}😔{% elif i == 2 %}😕{% elif i == 3 %}😐{% elif i == 4 %}🙂{% else %}😄{%
                                endif %}
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Stress Level -->
                <div class="mb-5">
                    <label class="form-label text-secondary small fw-bold d-block mb-3">STRESS LEVEL</label>
                    <div class="d-flex justify-content-around mood-selector">
                        {% for i in range(1, 6) %}
                        <label class="mood-option">
                            <input type="radio" name="stress" value="{{ i }}" required {% if existing and
                                existing.stress_level==i %}checked{% endif %}>
                            <div class="mood-emoji">
                                {% if i == 1 %}😌{% elif i == 2 %}🙂{% elif i == 3 %}😐{% elif i == 4 %}😰{% else %}😫{%
                                endif %}
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Optional Notes -->
                <div class="mb-4 text-start">
                    <label class="form-label text-secondary small fw-bold">WHAT'S ON YOUR MIND? (Optional)</label>
                    <textarea name="notes" class="form-control" rows="3"
                        placeholder="Feel free to share...">{% if existing %}{{ existing.notes }}{% endif %}</textarea>
                </div>

                <button type="submit" class="btn btn-primary px-5 py-3 btn-ripple">
                    {% if existing %}Update Check-in{% else %}Submit Check-in{% endif %}
                </button>

                <div class="mt-3">
                    <a href="{{ url_for('wellbeing.insights') }}" class="text-secondary small">View My Well-being
                        Insights</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .mood-selector {
        gap: 1rem;
    }

    .mood-option input {
        display: none;
    }

    .mood-emoji {
        font-size: 2.5rem;
        cursor: pointer;
        opacity: 0.3;
        transition: all 0.3s;
        padding: 1rem;
        border-radius: 50%;
    }

    .mood-option input:checked+.mood-emoji {
        opacity: 1;
        transform: scale(1.2);
        background: var(--glass-bg);
    }

    .mood-emoji:hover {
        opacity: 0.8;
    }
</style>
{% endblock %}
